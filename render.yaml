services:
  - type: web
    name: gihanga-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      # Set this to your deployed Vercel frontend URL(s) after that deploy
      # completes (comma-separate multiple origins, e.g. production + a
      # preview domain). See backend/.env.example for details.
      - key: FRONTEND_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: JWT_STAFF_ACCESS_SECRET
        generateValue: true
      - key: JWT_STAFF_REFRESH_SECRET
        generateValue: true
      - key: JWT_STAFF_ACCESS_EXPIRES_IN
        value: 8h
      - key: JWT_STAFF_REFRESH_EXPIRES_IN
        value: 7d
      - key: CLOUDINARY_URL
        sync: false
      - key: LIVEKIT_URL
        value: wss://gihanga-updates-v9t64obx.livekit.cloud
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: MTN_ENV
        value: sandbox
      - key: MTN_BASE_URL
        sync: false
      - key: MTN_TARGET_ENVIRONMENT
        sync: false
      - key: MTN_CURRENCY
        sync: false
      - key: MTN_CALLBACK_URL
        sync: false
      - key: MTN_COLLECTION_SUBSCRIPTION_KEY
        sync: false
      - key: MTN_COLLECTION_API_USER
        sync: false
      - key: MTN_COLLECTION_API_KEY
        sync: false
      - key: MTN_DISBURSEMENT_SUBSCRIPTION_KEY
        sync: false
      - key: MTN_DISBURSEMENT_API_USER
        sync: false
      - key: MTN_DISBURSEMENT_API_KEY
        sync: false
      - key: MTN_CALLBACK_TOKEN
        sync: false
